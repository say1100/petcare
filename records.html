    <style>
        .app-layout {
            display: flex;
            min-height: 100vh;
            background: var(--bg-page);
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-header {
            background: var(--bg-card);
            padding: var(--space-5) var(--space-6);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-header-left h1 {
            font-size: var(--font-xl);
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 4px 0;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .page-header-left .subtitle {
            font-size: var(--font-sm);
            color: var(--text-muted);
            margin: 0;
        }

        .page-container {
            flex: 1;
            padding: var(--space-6);
        }

        .filter-bar {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            padding: var(--space-4) var(--space-5);
            margin-bottom: var(--space-5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-tabs {
            display: flex;
            gap: var(--space-2);
        }

        .filter-tab {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--font-sm);
            cursor: pointer;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            transition: all var(--transition-fast);
        }

        .filter-tab:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .filter-tab.active {
            background: var(--primary-bg);
            color: var(--primary-dark);
            border-color: var(--primary-border);
            font-weight: 500;
        }

        .filter-actions {
            display: flex;
            gap: var(--space-3);
        }

        .search-input {
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            font-size: var(--font-sm);
            width: 200px;
            outline: none;
            transition: border-color var(--transition-fast);
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .main-panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            overflow: hidden;
        }

        .panel-header {
            padding: var(--space-4) var(--space-5);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--gray-50);
        }

        .panel-title {
            font-size: var(--font-md);
            font-weight: 600;
            color: var(--text-primary);
        }

        .panel-meta {
            font-size: var(--font-sm);
            color: var(--text-muted);
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
        }

        .record-table th {
            background: var(--gray-50);
            padding: var(--space-3) var(--space-4);
            text-align: left;
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-default);
            white-space: nowrap;
        }

        .record-table td {
            padding: var(--space-4);
            border-bottom: 1px solid var(--border-light);
            font-size: var(--font-sm);
            color: var(--text-secondary);
            vertical-align: top;
        }

        .record-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .record-question-cell {
            max-width: 280px;
        }

        .record-question-text {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .record-time {
            font-size: var(--font-xs);
            color: var(--text-muted);
        }

        .record-answer-cell {
            max-width: 320px;
        }

        .record-answer-text {
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .record-type {
            display: block;
            margin-top: var(--space-1);
            font-size: var(--font-xs);
            color: var(--text-muted);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: var(--radius-sm);
            font-size: var(--font-xs);
            font-weight: 500;
        }

        .status-badge.resolved {
            background: var(--success-bg);
            color: var(--success-dark);
        }

        .status-badge.transferred {
            background: var(--warning-bg);
            color: var(--warning-dark);
        }

        .status-badge.pending {
            background: var(--info-bg);
            color: var(--info);
        }

        .status-badge.risk {
            background: var(--danger-bg);
            color: var(--danger-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: var(--space-4);
        }
    </style>
</head>

            console.log("window.supabase 是否存在:", !!window.supabase);
            
            const SUPABASE_URL = "https://ihrzsxhbrvlogsahkmsgq.supabase.co";

            window.SUPABASE_URL = SUPABASE_URL;
            window.SUPABASE_ANON_KEY = SUPABASE_ANON_KEY;
            
            console.log("=== Supabase 配置 ===");
            console.log("SUPABASE_URL:", !!SUPABASE_URL);
            console.log("SUPABASE_ANON_KEY:", !!SUPABASE_ANON_KEY);
            
            if (window.supabase) {
                try {

                    window.supabaseClient = null;
                }
            } else {
                console.error("❌ window.supabase 不存在！");
                window.supabaseClient = null;
            }
        }
    </script>
    <script>
        async function testSupabaseConnection() {
            const resultElement = document.getElementById('supabaseTestResult');
            
            console.log('=== Supabase 连接测试开始 ===');
            console.log('Supabase URL 是否存在:', !!window.SUPABASE_URL);
            console.log('Supabase Key 是否存在:', !!window.SUPABASE_ANON_KEY);
            
            // 等待 client 初始化
            if (!window.supabaseClient) {
                resultElement.innerHTML = `<div style="color: var(--warning); font-weight: 600;">⏳ 正在等待 Supabase client 初始化...</div>`;
                
                // 等待最多 3 秒
                await new Promise(resolve => {
                    let attempts = 0;
                    const checkInterval = setInterval(() => {
                        attempts++;
                        if (window.supabaseClient || attempts >= 30) {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                });
            }
            
            if (!window.supabaseClient) {
                const errorMsg = 'Supabase client 未初始化';
                console.error('错误:', errorMsg);
                resultElement.innerHTML = `<div style="color: var(--danger); font-weight: 600;">❌ ${errorMsg}</div>`;
                return;
            }
            
            try {
                console.log('开始查询 qa_records 表...');
                
                const { data, error } = await window.supabaseClient
                    .from('qa_records')
                    .select('*')
                    .limit(5);
                
                console.log('查询结果:', data);
                console.log('错误信息:', error);
                
                if (error) {
                    console.error('Supabase 查询失败:', error);
                    resultElement.innerHTML = `
                        <div style="color: var(--danger);">
                            <div style="font-weight: 600; margin-bottom: 8px;">❌ Supabase 连接失败</div>
                            <div style="background: var(--danger-bg); padding: 12px; border-radius: var(--radius-md); font-family: monospace; font-size: 12px;">
                                <div><strong>错误代码:</strong> ${error.code || 'N/A'}</div>
                                <div><strong>错误信息:</strong> ${error.message || 'N/A'}</div>
                                <div><strong>错误详情:</strong> ${error.details || 'N/A'}</div>
                                <div><strong>错误提示:</strong> ${error.hint || 'N/A'}</div>
                            </div>
                        </div>
                    `;
                } else {
                    console.log('Supabase 连接成功，查询到', data?.length || 0, '条数据');
                    resultElement.innerHTML = `
                        <div style="color: var(--success);">
                            <div style="font-weight: 600; margin-bottom: 8px;">✅ Supabase 连接成功</div>
                            <div style="background: var(--success-bg); padding: 12px; border-radius: var(--radius-md);">
                                <div>成功查询到 <strong>${data?.length || 0}</strong> 条数据</div>
                                ${data && data.length > 0 ? `
                                    <div style="margin-top: 8px; font-size: 11px; color: var(--text-muted);">
                                        数据预览: ${JSON.stringify(data[0]).substring(0, 100)}...
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Supabase 连接异常:', err);
                resultElement.innerHTML = `
                    <div style="color: var(--danger);">
                        <div style="font-weight: 600; margin-bottom: 8px;">❌ Supabase 连接异常</div>
                        <div style="background: var(--danger-bg); padding: 12px; border-radius: var(--radius-md); font-family: monospace; font-size: 12px;">
                            <div><strong>异常类型:</strong> ${err.name || 'Unknown'}</div>
                            <div><strong>异常信息:</strong> ${err.message || 'N/A'}</div>
                            <div><strong>异常堆栈:</strong> ${err.stack?.substring(0, 200) || 'N/A'}...</div>
                        </div>
                    </div>
                `;
            }
            
            console.log('=== Supabase 连接测试结束 ===');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(testSupabaseConnection, 500);
        });
    </script>
